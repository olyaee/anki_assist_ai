prompt:
  system_message: >
    You are an expert German language teacher creating comprehensive word profiles for {proficiency_level} learners. The source language is {source_language}.

    ## Task Overview
    Create a detailed German word profile that includes: translation, grammatical information, and three contextual example sentences that incorporate grammar from Lecture {lecture_number}.

    ## Step 1: Language Detection & Translation

    **Input Processing:**
    - If the input word is in {source_language}, first translate it to German
    - If already in German, use it directly
    - For polysemous words (multiple meanings), list ALL common meanings ordered from most to least frequent
    - Examples: "Schlüssel" → ['Key (for a door)', 'Key (solution/essential idea)'] | "Bank" → ['Bank (financial)', 'Bench (furniture)', 'Bank (of river)']

    ## Step 2: Complete Grammatical Analysis

    Provide comprehensive grammatical details based on word type:

    **Nouns (n):**
    - Article: der/die/das
    - Plural formation: Show the ending (e.g., "-n", "-e", "-er") or mark as "sg." (singular only) or "pl." (plural only)
    - Examples: "Hütte → -n" | "Himmel → -" | "Ökostrom → sg."

    **Verbs (v):**
    - Regularity: regular or irregular
    - Conjugations (er-form only): Präsens, Präteritum, Perfekt
      - Example: "entschließen → er entschließt, entschloss, hat entschlossen"
    - Reflexive: Indicate if reflexive (e.g., "sich kümmern" → True, "gehen" → False)
    - Preposition: If verb requires a preposition, show with case (e.g., "schützen (vor + D.)", "verzichten (auf + A.)")

    **Adjectives (adj):**
    - Regularity: regular or irregular
    - Forms: comparative, superlative (e.g., "gut → besser, am besten" | "klein → kleiner, am kleinsten")
    - Preposition: If applicable (e.g., "stolz (auf + A.)", "zufrieden (mit + D.)")

    **Other Word Types:**
    Mark as: (adv) for adverbs, (pron) for pronouns, (prep) for prepositions, (conj) for conjunctions, or () if none apply.

    ## Step 3: Create Engaging Example Sentences

    **Critical Requirements:**
    Generate THREE example sentences that demonstrate authentic, memorable usage appropriate for {proficiency_level} learners.

    **Grammar Integration (MOST IMPORTANT):**
    You MUST incorporate the specific grammar structures from Lecture {lecture_number} provided in the <Grammar></Grammar> section. Each example should naturally demonstrate at least one grammar point from this lecture.

    **Quality Guidelines:**
    - Make examples personally relatable and contextually rich—situations learners might encounter
    - Use vivid, specific scenarios rather than generic statements
    - Show the word in different contexts when it has multiple meanings
    - Vary sentence structure and complexity within the {proficiency_level} range
    - Include both German and {source_language} translations for each example
    - Examples should feel natural, not forced or overly academic

    **Example Quality:**
    Good: "Ich habe meinen Schlüssel verloren und kann nicht in die Wohnung." (relatable, specific situation)
    Poor: "Der Schlüssel ist wichtig." (too generic, not memorable)

  image_prompt: >
    Create a vivid, memorable visual mnemonic for the German word "{german_word}" that will help language learners instantly recall its meaning.

    ## Core Requirements

    **Visual Mnemonic Approach:**
    Design a single, striking scene that creates a strong mental association with the word's meaning. The image should function as a memory anchor—something emotionally engaging and visually distinctive that the learner will remember long after seeing it.

    **Composition Guidelines:**
    - Subject: Show a clear, recognizable subject performing an action or in a meaningful state
    - Action: Include dynamic movement or emotion when applicable to make the scene memorable
    - Setting: Place the subject in a specific, culturally appropriate location that reinforces context
    - Style: Use a clean, illustrative style with bold colors and clear shapes—avoid photorealism; aim for clarity over complexity
    - Lighting: Use dramatic or warm lighting to enhance emotional impact and memorability

    **Memory Enhancement:**
    - Create ONE focused visual concept—avoid clutter or multiple competing elements
    - Use exaggerated features, vivid colors, or unexpected compositions to make the image stick in memory
    - Include emotional cues: facial expressions, body language, atmospheric elements that convey feeling
    - Make it personally relatable—show scenarios learners might encounter in daily life

    **Technical Constraints:**
    - Absolutely no text, letters, numbers, signs, labels, or written characters anywhere in the image
    - No watermarks or logos
    - Composition should work well in a 1:1 square format
    - Keep visual elements clear and recognizable even at small sizes (256x256px)

    **Cultural Appropriateness:**
    For German language learning, incorporate German cultural context when relevant (architecture, clothing, settings, objects commonly found in German-speaking regions) but keep it accessible to international learners.

    Generate a single, powerful visual that makes "{german_word}" unforgettable through vivid imagery and emotional resonance.

gemini:
  # Text generation model
  text_model: "gemini-2.5-flash"

  # Image generation (Nano Banana)
  image_model: "gemini-2.5-flash-image"
  image_aspect_ratio: "1:1"  # Options: 1:1, 16:9, 4:3, 3:2, 9:16, 3:4, 2:3, 5:4, 4:5, 21:9
  image_size: "1K"  # Options: 1K, 2K, 4K

  # Text-to-speech
  tts_model: "gemini-2.5-flash-preview-tts"
  tts_voices:  # 8 main voices (4 male, 4 female), will be randomly selected
    - Zephyr
    - Puck
    - Charon
    - Kore
    - Fenrir
    - Leda
    - Orus
    - Aoede

schema:
  type: object
  properties:
    original_word: { type: string }
    german_word: { type: string }
    classification: 
      type: string 
      enum: ["(n)", "(v)", "(adj)", "(adv)", "(pron)", "(prep)", "(conj)", "()"]
    source_language_translation: 
      type: array
      items:
        type: string
      description: "List of translations of the German word in the source language"
      minItems: 1
    additional_grammatical_info:
      type: object
      properties:
        noun:
          type: object
          properties:
            article: 
              type: string 
              enum: ["der", "die", "das"]
            plural_form: { type: string }
        verb:
          type: object
          properties:
            irregular: { type: boolean }
            infinitive: { type: string }
            praesens: { type: string }
            praeteritum: { type: string }
            perfekt: { type: string }
            reflexive: { type: boolean }
            praeposition: { type: string }
        adjective:
          type: object
          properties:
            irregular: { type: boolean }
            comparative: { type: string }
            superlative: { type: string }
            praeposition: { type: string }
    examples:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: object
        properties:
          german_example: { type: string }
          source_example_translation: { type: string }
        required: ["german_example", "source_example_translation"]
      minContains: 3
      maxContains: 3
  required: ["original_word", "german_word", "classification", "source_language_translation", "examples", "additional_grammatical_info"]

files:
  directory: "./files"

