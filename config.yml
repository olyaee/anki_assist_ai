languages:
  supported_source_languages:
    - English
    - Farsi
    - Spanish
    - French
    - German
    - Italian
    - Japanese
    - Korean
    - Portuguese
    - Russian
    - Chinese
    - Turkish
    - Arabic
    - Hindi

  supported_proficiency_levels:
    - A1
    - A2
    - B1
    - B2
    - C1
    - C2

prompt:
  system_message: >
    <prompt>
    You will create a dictionary-style **German Word Profile** for the given word, regardless of whether the input is in German or source language. Our source language is **{source_language}**. Follow the steps below:

    1. **Detect the Input Language**:
        - If the word is already in **German**, proceed directly to step 2.
        - If the word is in **{source_language}**, translate it into **German** and use the German version of the word for steps 3 and 4.

    2. **Translate the Word**:  
        - Translate the word to the opposite language:
            - If the word is in **German**, translate it to **{source_language}**.
            - If the word is in **{source_language}**, translate it to **German**.
        - If the word has multiple meanings, list them in order from the most commonly used to the least commonly used. for example:
            - examples below are german-english translations. if the word is in {source_language}, use the {source_language}-german translations.
                - "Schlüssel → ['Key (for a door)', 'Key (solution or essential idea)']"
                - "Schloss → ['Lock (on a door)', 'Castle']"
                - "Bank → ['Bank (financial institution)', 'Bench (to sit on)', 'Bank (of a river)']"
                - "Buch → ['Book', 'Account book (for accounting)']"
                - "Strom → ['Electricity', 'Stream (of water)', 'Current (of air or electricity)']"
                - "Leiter → ['Leader (of a group or organization)', 'Ladder']"
                - "laufen → ['To run', 'To walk (casually, in some dialects)', 'To be running/working (e.g., Der Motor läuft = The motor is running)']"
                - "ziehen → ['To pull', 'To move (e.g., umziehen = to move to a new home)', 'To draw (e.g., a card or lottery ticket)']"
                - "fahren → ['To drive', 'To travel (by vehicle)', 'To go (e.g., mit dem Zug fahren = to go by train)']"
                - "schlagen → ['To hit', 'To beat (e.g., Schlagzeug spielen = to play the drums)', 'To defeat (e.g., den Gegner schlagen = to defeat the opponent)']"
                - "arm → ['Poor (not wealthy)', 'Poor (pitiful, as in poor thing)']"
                - "schwer → ['Heavy', 'Difficult']"
                - "frei → ['Free (not occupied)', 'Free (no cost)', 'Free (unrestricted)']"
                - "alt → ['Old (age of a person or object)', 'Former (previous or earlier)']"
                - "einfach → ['Simple (not complicated)', 'Easy (to do)', 'Plain (basic or unadorned)']"
                - "Tisch → ['Table']"
                - "Haus → ['House']"
                - "Baum → ['Tree']"
                - "Tag → ['Day']"
                - 20. Wasser → Water   
    3. **Grammatical Information**:
        - **Noun**:
            - Indicate that the word is a noun with '(n)'.
            - Provide the appropriate definite article ('der', 'die', 'das' for German).
            - Include how the plural form is formed. If the noun exists only in the singular, mark it with '(sg.)'. If the noun exists only in the plural, mark it with '(pl.)'. if it is singular by default, indicate that the word is singular by default with '(sg.)' for example: 
                1. hütte --> -n
                2. ferienclub --> -s
                3. himmel --> -s
                4. weihnachtsferien --> pl.
                5. Ökostrom --> sg.
        - **Verb**:
            - Indicate that the word is a verb with '(v)'.
            - Indicate if the verb is regular or irregular.
            - Provide the verb conjugations: Infinitive, Präsens, Präteritum, Perfekt. Only for er. For example:
                1. entschließen --> er entschließt, entschloss, hat entschlossen
                2. verraten --> er verrät, verriet, hat verraten
                3. entsprechen --> er entspricht, entsprach, hat entsprochen
            - If it is a reflexive verb. Here are some examples: 
                1. kümmern --> kümmert sich --> True
                2. gehen --> geht --> False
                3. streiten --> streiten sich --> True
                4. ereignen --> ereignen sich --> True
            - If the verb with präposition, indicate the präposition in paranthesis.
                1. schützen --> (vor + d.)
                2. verzichten --> (auf + a.)
                3. anpassen --> (an + a.)
        - **Adjective**:
            - Indicate that the word is an adjective with '(adj)'.
                1. schwach --> irregular
                2. gut --> irregular
                3. klein --> regular
                4. hoch --> regular
            - Mention the comparative and superlative forms.
                1. schwach --> schwächer - am schwächsten
                2. gut --> besser - am besten
                3. klein --> kleiner - am kleinsten
                4. hoch --> höher - am höchsten
            - If the adjective has a präposition, indicate the präposition in paranthesis.
                1. interessiert --> (an + d.)
                2. stolz --> (auf + a.)
                3. zufrieden --> (mit + d.)
        - **Adverb**, **Pronoun**, **Preposition**, **Conjunction**:
            - Indicate that the word is an adverb with '(adv)', pronoun with '(pron)', preposition with '(prep)', conjunction with '(conj)'.
        - **None of the above**:
            - Indicate that the word is none of them with '()'.

    4. **Generate Examples**: Provide three example sentences showing a typical usage of the word. The exammples must follow the following rules:
        - At least one of the examples should use the grammer of lecture {lecture_number}. The grammer of the lectures are indicated the section <Grammer> <Grammer/>. We have in total 6 Lectures. 
        - The examples should be at the {proficiency_level} level.
        - Try to use words of the {proficiency_level} level that are mentioned in <Vocabulary> <Vocabulary/>.
        - Each example should be both in German and {source_language}.
    </prompt>

openai:
  text_model: "gpt-4o-mini"
  image_model: "dall-e-3"
  image_size: "1024x1024"
  tts_model: "tts-1"

schema:
  type: object
  properties:
    original_word: { type: string }
    german_word: { type: string }
    classification: 
      type: string 
      enum: ["(n)", "(v)", "(adj)", "(adv)", "(pron)", "(prep)", "(conj)", "()"]
    source_language_translation: 
      type: array
      items:
        type: string
      description: "List of translations of the German word in the source language"
    additional_grammatical_info:
      type: object
      properties:
        noun:
          type: object
          properties:
            article: 
              type: string 
              enum: ["der", "die", "das"]
            plural_form: { type: string }
        verb:
          type: object
          properties:
            irregular: { type: boolean }
            infinitive: { type: string }
            praesens: { type: string }
            praeteritum: { type: string }
            perfekt: { type: string }
            reflexive: { type: boolean }
            praeposition: { type: string }
        adjective:
          type: object
          properties:
            irregular: { type: boolean }
            comparative: { type: string }
            superlative: { type: string }
            praeposition: { type: string }
    examples:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: object
        properties:
          german_example: { type: string }
          source_example_translation: { type: string }
        required: ["german_example", "source_example_translation"]
  required: ["original_word", "german_word", "classification", "source_language_translation", "examples", "additional_grammatical_info"]

files:
  directory: "./files"

